<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#6c5ce7"/>
<title>Neutrophil Words</title>
<link rel="manifest" href="manifest.json"/>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#1f2d46;--muted:#6d7480;--purple:#6c5ce7;--green:#00a878;--red:#d64550;--amber:#c78a00;--line:#e6e7ee}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(247,247,251,.95);backdrop-filter:blur(12px);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0 0 10px}.toolbar{display:flex;gap:8px}.toolbar input,.toolbar select{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px;background:white;font-size:15px}
main{max-width:760px;margin:auto;padding:14px 14px 100px}.stats{display:flex;gap:8px;margin:4px 0 14px}.stat{flex:1;background:white;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(35,35,55,.04)}
.wordrow{display:flex;align-items:center;gap:10px}.word{font-size:25px;font-weight:800;color:#3c4b73;flex:1}.speaker{border:0;border-radius:50%;width:44px;height:44px;background:#ece9ff;font-size:20px}.ipa{color:#7658b5;font-size:15px;margin-top:4px}.cn{font-size:17px;font-weight:700;margin-top:10px}.explain,.example{color:var(--muted);font-size:14px;line-height:1.5;margin-top:8px}.example{background:#f8f8fc;padding:10px;border-radius:12px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:8px 10px;font-size:13px}.btn.primary{background:var(--purple);color:white;border-color:var(--purple)}.btn.good{background:#e8f8f2;color:#087a59}.btn.mid{background:#fff7e6;color:#8b6200}.btn.bad{background:#fff0f1;color:#a52f38}.tag{display:inline-block;font-size:11px;background:#f0effc;color:#5c50a3;border-radius:999px;padding:4px 8px;margin-top:10px}
.fab{position:fixed;right:18px;bottom:76px;border:0;border-radius:50%;width:58px;height:58px;background:var(--purple);color:white;font-size:30px;box-shadow:0 8px 24px rgba(60,50,140,.28);z-index:5}
nav{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);display:flex;z-index:4;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:white;padding:12px 4px;font-size:13px;color:var(--muted)}nav button.active{color:var(--purple);font-weight:700}
.modal{display:none;position:fixed;inset:0;background:rgba(15,20,35,.45);z-index:10;padding:24px 14px;overflow:auto}.modal.show{display:block}.sheet{max-width:600px;margin:auto;background:white;border-radius:20px;padding:18px}
.sheet h2{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px}.field textarea{min-height:76px}
.row{display:flex;gap:8px}.row>*{flex:1}.hidden{display:none!important}
.flash{min-height:430px;display:flex;flex-direction:column;justify-content:center;text-align:center}.flash .word{font-size:34px}.reveal{margin-top:20px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.progressWrap{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.progressBar{height:10px;background:#ececf3;border-radius:99px;overflow:hidden;margin-top:8px}.progressBar>div{height:100%;background:var(--purple);width:0%}
.small{font-size:12px;color:var(--muted)}
.badgeDue{display:inline-block;background:#fff0f1;color:#a52f38;border-radius:999px;padding:3px 7px;font-size:11px;margin-left:6px}
</style>
</head>
<body>
<header>
  <h1>🧬 Neutrophil Words</h1>
  <div class="toolbar">
    <input id="search" placeholder="搜索英文 / 中文…"/>
    <select id="category"><option value="">全部分类</option></select>
  </div>
</header>

<main>
  <section id="listView">
    <div class="stats">
      <div class="stat"><b id="countAll">0</b><span>词汇</span></div>
      <div class="stat"><b id="countDue">0</b><span>今日到期</span></div>
      <div class="stat"><b id="countMastered">0</b><span>已掌握</span></div>
    </div>
    <div id="cards"></div>
  </section>

  <section id="reviewView" class="hidden">
    <div class="progressWrap">
      <div><b>今日 10 词</b> <span class="small" id="todayText"></span></div>
      <div class="progressBar"><div id="progressBar"></div></div>
    </div>
    <div class="card flash">
      <div class="tag" id="reviewCat"></div>
      <div class="word" id="reviewWord"></div>
      <div class="ipa" id="reviewIpa"></div>
      <button class="speaker" id="reviewSpeak">🔊</button>
      <div id="reviewDetails" class="hidden reveal">
        <div class="cn" id="reviewCn"></div>
        <div class="explain" id="reviewExplain"></div>
        <div class="example" id="reviewExample"></div>
      </div>
      <button class="btn primary reveal" id="revealBtn">查看答案</button>
      <div class="actions hidden" id="reviewActions" style="justify-content:center">
        <button class="btn bad" id="hardBtn">不会</button>
        <button class="btn mid" id="mediumBtn">模糊</button>
        <button class="btn good" id="easyBtn">会</button>
      </div>
    </div>
  </section>
</main>

<button class="fab" id="addBtn">＋</button>

<nav>
  <button id="tabWords" class="active">📚 单词</button>
  <button id="tabReview">🧠 今日复习</button>
</nav>

<div class="modal" id="modal">
  <div class="sheet">
    <h2 id="modalTitle">添加单词</h2>
    <input type="hidden" id="editId"/>
    <div class="field"><label>英文单词 / 短语 *</label><input id="fWord"/></div>
    <div class="row">
      <div class="field"><label>IPA 音标</label><input id="fIpa"/></div>
      <div class="field"><label>分类</label><input id="fCategory" value="My Words"/></div>
    </div>
    <div class="field"><label>中文解释</label><input id="fCn"/></div>
    <div class="field"><label>关键词解释</label><textarea id="fExplain"></textarea></div>
    <div class="field"><label>英文例句</label><textarea id="fExample"></textarea></div>
    <div class="actions">
      <button class="btn primary" id="saveBtn">保存</button>
      <button class="btn" id="cancelBtn">取消</button>
    </div>
  </div>
</div>

<script src="seed_v2.js"></script>
<script>
const KEY="neutrophil_vocab_v2";
const TODAY_KEY="neutrophil_today_v2";
let words=JSON.parse(localStorage.getItem(KEY)||"null") || SEED_WORDS.map(w=>({...w,level:0,nextReview:null,lastReview:null,streak:0}));
const existingIds=new Set(words.map(w=>w.id));
const newSeedWords=SEED_WORDS.filter(w=>!existingIds.has(w.id)).map(w=>({...w,level:0,nextReview:null,lastReview:null,streak:0}));
if(newSeedWords.length){words.push(...newSeedWords);localStorage.setItem(KEY,JSON.stringify(words));}
let todayState=JSON.parse(localStorage.getItem(TODAY_KEY)||"null") || null;
let reviewQueue=[], reviewIndex=0;
const $=id=>document.getElementById(id);

function todayStr(){return new Date().toISOString().slice(0,10)}
function addDays(dateStr,days){const d=dateStr?new Date(dateStr+"T12:00:00"):new Date(); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10)}
function save(){localStorage.setItem(KEY,JSON.stringify(words)); render();}
function saveToday(){localStorage.setItem(TODAY_KEY,JSON.stringify(todayState))}
function speak(text){
  if(!("speechSynthesis" in window)){alert("当前浏览器不支持语音朗读。");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=.82;
  const voices=speechSynthesis.getVoices();
  const v=voices.find(x=>x.lang==="en-US")||voices.find(x=>x.lang.startsWith("en"));
  if(v)u.voice=v; speechSynthesis.speak(u);
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function categories(){return [...new Set(words.map(x=>x.category).filter(Boolean))].sort();}
function renderFilters(){
  const sel=$("category"),cur=sel.value; sel.innerHTML='<option value="">全部分类</option>';
  categories().forEach(c=>sel.insertAdjacentHTML("beforeend",`<option>${esc(c)}</option>`)); sel.value=cur;
}
function isDue(w){return !w.nextReview || w.nextReview<=todayStr()}
function filtered(){
  const q=$("search").value.toLowerCase().trim(),c=$("category").value;
  return words.filter(w=>(!c||w.category===c)&&(!q||[w.word,w.cn,w.explain,w.example].join(" ").toLowerCase().includes(q)));
}
function render(){
  renderFilters();
  $("countAll").textContent=words.length;
  $("countDue").textContent=words.filter(isDue).length;
  $("countMastered").textContent=words.filter(x=>(x.level||0)>=4).length;
  const arr=filtered(),box=$("cards"); box.innerHTML="";
  if(!arr.length){box.innerHTML='<div class="empty">没有找到单词</div>';return;}
  arr.forEach(w=>{
    const d=document.createElement("div");d.className="card";
    const due=isDue(w)?'<span class="badgeDue">待复习</span>':'';
    d.innerHTML=`<div class="wordrow"><div class="word">${esc(w.word)} ${due}</div><button class="speaker">🔊</button></div>
      <div class="ipa">${esc(w.ipa)}</div><div class="cn">${esc(w.cn)}</div>
      <div class="explain">${esc(w.explain)}</div><div class="example"><b>Example:</b> ${esc(w.example)}</div>
      <span class="tag">${esc(w.category||"")}</span>
      <div class="actions">
        <button class="btn edit">编辑</button>
        <button class="btn good manual">标记“会”</button>
        <button class="btn bad del">删除</button>
      </div>`;
    d.querySelector(".speaker").onclick=()=>speak(w.word);
    d.querySelector(".edit").onclick=()=>openModal(w);
    d.querySelector(".manual").onclick=()=>rateWord(w,"easy",false);
    d.querySelector(".del").onclick=()=>{if(confirm(`删除 ${w.word}？`)){words=words.filter(x=>x.id!==w.id);save()}};
    box.appendChild(d);
  })
}
function openModal(w=null){
  $("modal").classList.add("show");$("modalTitle").textContent=w?"编辑单词":"添加单词";
  $("editId").value=w?.id||"";$("fWord").value=w?.word||"";$("fIpa").value=w?.ipa||"";
  $("fCategory").value=w?.category||"My Words";$("fCn").value=w?.cn||"";
  $("fExplain").value=w?.explain||"";$("fExample").value=w?.example||"";
}
$("saveBtn").onclick=()=>{
  const word=$("fWord").value.trim(); if(!word){alert("请输入英文单词");return;}
  const id=$("editId").value,old=words.find(x=>x.id===id);
  const obj={id:id||"user-"+Date.now(),word,ipa:$("fIpa").value.trim(),category:$("fCategory").value.trim()||"My Words",
    cn:$("fCn").value.trim(),explain:$("fExplain").value.trim(),example:$("fExample").value.trim(),
    level:old?.level||0,nextReview:old?.nextReview||null,lastReview:old?.lastReview||null,streak:old?.streak||0,
    createdAt:old?.createdAt||todayStr()};
  if(old)Object.assign(old,obj);else words.unshift(obj);
  $("modal").classList.remove("show");save();
}
$("cancelBtn").onclick=()=>$("modal").classList.remove("show");
$("addBtn").onclick=()=>openModal();
$("search").oninput=render;$("category").onchange=render;

function ensureToday(){
  if(!todayState || todayState.date!==todayStr()){
    const due=[...words].filter(isDue).sort((a,b)=>(a.level||0)-(b.level||0));
    const extras=[...words].filter(w=>!isDue(w)).sort((a,b)=>(a.level||0)-(b.level||0));
    const selected=[...due,...extras].slice(0,10).map(w=>w.id);
    todayState={date:todayStr(),ids:selected,done:[]}; saveToday();
  }
}
function buildReview(){
  ensureToday();
  reviewQueue=todayState.ids.map(id=>words.find(w=>w.id===id)).filter(Boolean);
  reviewIndex=Math.min(todayState.done.length,Math.max(0,reviewQueue.length-1));
  showReview();
}
function updateProgress(){
  const total=todayState?.ids?.length||0,done=todayState?.done?.length||0;
  $("todayText").textContent=`${done} / ${total} 完成`;
  $("progressBar").style.width=(total?done/total*100:0)+"%";
}
function showReview(){
  updateProgress();
  if(!reviewQueue.length){$("reviewWord").textContent="今天没有需要复习的词";return;}
  if(todayState.done.length>=reviewQueue.length){
    $("reviewCat").textContent="完成";
    $("reviewWord").textContent="🎉 今日 10 词完成";
    $("reviewIpa").textContent="";
    $("reviewDetails").classList.add("hidden");$("reviewActions").classList.add("hidden");$("revealBtn").classList.add("hidden");$("reviewSpeak").classList.add("hidden");
    return;
  }
  $("reviewSpeak").classList.remove("hidden");
  const w=reviewQueue[todayState.done.length];
  $("reviewCat").textContent=w.category||"";$("reviewWord").textContent=w.word;$("reviewIpa").textContent=w.ipa;
  $("reviewCn").textContent=w.cn;$("reviewExplain").textContent=w.explain;$("reviewExample").innerHTML="<b>Example:</b> "+esc(w.example);
  $("reviewDetails").classList.add("hidden");$("reviewActions").classList.add("hidden");$("revealBtn").classList.remove("hidden");
  $("reviewSpeak").onclick=()=>speak(w.word);
}
function rateWord(w,rating,fromReview=true){
  let level=w.level||0,days=1;
  if(rating==="hard"){level=0;days=1;w.streak=0}
  if(rating==="medium"){level=Math.max(1,level);days=[1,2,4,7,14,30][Math.min(level,5)];w.streak=Math.max(0,w.streak||0)}
  if(rating==="easy"){level=Math.min(5,level+1);days=[1,3,7,14,30,60][level];w.streak=(w.streak||0)+1}
  w.level=level;w.lastReview=todayStr();w.nextReview=addDays(todayStr(),days);
  save();
  if(fromReview){
    if(!todayState.done.includes(w.id))todayState.done.push(w.id);saveToday();showReview();
  }
}
$("revealBtn").onclick=()=>{$("reviewDetails").classList.remove("hidden");$("reviewActions").classList.remove("hidden");$("revealBtn").classList.add("hidden")};
$("hardBtn").onclick=()=>rateWord(reviewQueue[todayState.done.length],"hard",true);
$("mediumBtn").onclick=()=>rateWord(reviewQueue[todayState.done.length],"medium",true);
$("easyBtn").onclick=()=>rateWord(reviewQueue[todayState.done.length],"easy",true);

function setTab(review){
  $("listView").classList.toggle("hidden",review);$("reviewView").classList.toggle("hidden",!review);
  $("tabWords").classList.toggle("active",!review);$("tabReview").classList.toggle("active",review);
  $("addBtn").classList.toggle("hidden",review);if(review)buildReview();
}
$("tabWords").onclick=()=>setTab(false);$("tabReview").onclick=()=>setTab(true);

render();
</script>
</body></html>
