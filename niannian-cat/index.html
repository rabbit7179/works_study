<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>念念的喵喵成长屋</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffeff4;color:#594353;font-family:system-ui,-apple-system,sans-serif}.app{max-width:540px;min-height:100vh;margin:auto;padding:15px;background:linear-gradient(#fff4f7,#fff9ee)}h1{font-size:23px;margin:7px 0 14px}.top,.stats,.actions,.tabs,.answers,.grid{display:grid;gap:9px}.top{grid-template-columns:1fr auto;align-items:center}.coins{background:#fff;padding:9px 15px;border-radius:40px;font-weight:900}.stats{grid-template-columns:repeat(3,1fr)}.stats>div,.panel{background:white;border-radius:17px;padding:12px;box-shadow:0 3px 9px #b896a91a}.stats>div{font-size:12px;font-weight:800}.bar{height:9px;border-radius:20px;background:#eee2e7;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ff8ba9;transition:width .25s} .scene{height:350px;position:relative;background:radial-gradient(ellipse at 85% 22%,#fff9d7aa,transparent 36%),linear-gradient(180deg,#dceefa 0%,#e8f1e5 60%,#b6c99b 60%,#93b47d 100%);border:4px solid white;border-radius:24px;margin:12px 0;overflow:hidden;isolation:isolate}
.scene:after{content:"";position:absolute;bottom:0;height:38px;left:0;right:0;background:repeating-linear-gradient(95deg,#8aa86b 0 5px,#97b474 5px 11px);opacity:.7}
.house{position:absolute;right:8px;bottom:29px;width:51%;height:53%;z-index:1;transition:all .4s;filter:drop-shadow(4px 7px 3px #53694b66)}
.roof{height:35%;background:repeating-linear-gradient(0deg,#935b50 0 5px,#b97461 6px 11px);clip-path:polygon(50% 0%,100% 100%,0 100%)}
.wall{height:65%;background:repeating-linear-gradient(0deg,#bb8b62 0 8px,#c99c76 8px 17px);border:6px solid #a17654;border-radius:4px 4px 12px 12px;display:flex;align-items:end;justify-content:center}
.door{height:76%;width:45%;border-radius:55% 55% 0 0;background:radial-gradient(ellipse at 50% 55%,#363034,#6c554c);border:6px solid #8b5f48;box-shadow:inset 0 5px 16px #201e1d}
.scene.tier1 .roof{background:repeating-linear-gradient(0deg,#7f5140 0 5px,#aa7155 5px 11px)}.scene.tier1 .wall{background:repeating-linear-gradient(0deg,#f5d8b4 0 12px,#e9c39c 12px 19px);border-color:#ba8d62}
.scene.tier2{background:linear-gradient(#b4dcfa 0 63%,#a1cfaa 63%)}
.scene.tier2 .roof{background:repeating-linear-gradient(0deg,#737488 0 6px,#9494af 6px 12px)}.scene.tier2 .wall{background:repeating-linear-gradient(0deg,#d7c9c2 0 12px,#f0e6da 12px 21px);border-color:#a8a0a0}
.scene.tier2 .house{height:68%;width:57%}
.cat{position:absolute;bottom:25px;left:6px;width:100px;height:124px;z-index:3;transform-origin:bottom left;animation:bob 2.2s ease-in-out infinite;transition:width .5s,height .5s;filter:drop-shadow(0 9px 5px #7656)}
.cat img{width:100%;height:100%;object-fit:cover;object-position:center 43%;border-radius:45% 45% 37% 37%;-webkit-mask-image:radial-gradient(ellipse 74% 78% at 50% 48%,black 68%,transparent 100%);mask-image:radial-gradient(ellipse 74% 78% at 50% 48%,black 68%,transparent 100%)}
.cat .fallback{display:none;font-size:80px}
@keyframes bob{50%{translate:0 -8px}}
.decor{position:absolute;inset:0;pointer-events:none;z-index:2}.decor span{position:absolute;font-size:33px;filter:drop-shadow(1px 4px 2px #5547)}.decor .bow{left:22%;bottom:84px;font-size:24px}.decor .flower{left:7%;bottom:18px}.decor .tree{right:2%;bottom:22px;font-size:65px}.decor .crown{left:20%;bottom:120px;font-size:28px}
.growth{position:absolute;bottom:5px;left:8px;z-index:4;background:#fffdf5e8;border-radius:20px;padding:4px 9px;font-weight:800;font-size:12px}
.growth-hint{font-size:12px;font-weight:700;text-align:center;color:#b04c78;padding:5px 0}.speech{position:absolute;left:12px;top:15px;background:#ffffffdd;padding:8px 12px;border-radius:15px;font-size:13px}.actions{grid-template-columns:repeat(4,1fr)}button{border:0;touch-action:manipulation;cursor:pointer;font:inherit;font-weight:800}.actions button,.tabs button{background:white;border:1px solid #ffd1df;border-radius:15px;padding:12px 3px;font-size:13px}.tabs{grid-template-columns:repeat(3,1fr);margin:15px 0}.tabs .chosen{background:#ffd9e8}.panel{padding:16px}.question{font-size:34px;font-weight:900;text-align:center;background:#fff1df;border-radius:18px;padding:25px 8px;margin:14px 0}.answers{grid-template-columns:1fr 1fr}.answers button{background:#fbe1ed;border:2px solid #f7bfd7;border-radius:16px;font-size:23px;padding:15px}.answers button.correct{background:#c8f5dc;border-color:#63ca94}.answers button.wrong{background:#ffe1dd}.primary{background:#fa7da4;color:white;border-radius:15px;width:100%;padding:13px;margin-top:13px}.grid{grid-template-columns:1fr 1fr}.item{border:1px solid #f6d2df;border-radius:15px;text-align:center;padding:14px 5px}.item button{background:#ffd9e8;border-radius:11px;padding:8px 14px;margin-top:8px}.item button:disabled{opacity:.45}.small{font-size:12px;color:#8d7482}.hidden{display:none}.toast{text-align:center;color:#b34f78;font-weight:800;min-height:30px;padding-top:8px}
</style></head><body><main class="app"><div class="top"><h1>🐾 念念的喵喵成长屋</h1><div class="coins" id="coins"></div></div><div id="level" style="font-weight:800"></div><div class="bar"><i id="xpbar"></i></div><div class="stats" style="margin-top:12px"><div>🐟 饱腹 <span id="food"></span><div class="bar"><i id="foodbar"></i></div></div><div>💧 水分 <span id="water"></span><div class="bar"><i id="waterbar"></i></div></div><div>💗 开心 <span id="happy"></span><div class="bar"><i id="happybar"></i></div></div></div><div class="scene" id="scene"><div class="speech" id="mood">喵～陪我玩吧！</div><div class="decor" id="decor"></div><div class="house" id="house"><div class="roof"></div><div class="wall"><div class="door"></div></div></div><div class="cat" id="cat"><img alt="小奶猫" src="https://images.unsplash.com/photo-1573865526739-10659fec78a5?auto=format&fit=crop&w=480&q=85" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="fallback">🐈</span></div><div class="growth" id="catlabel"></div></div><div class="growth-hint" id="growthHint">答题赚经验，小猫会逐渐长大</div><div class="actions"><button id="feed">🐟<div>喂食</div><span class="small" id="fish"></span></button><button id="drink">🥛<div>喝水</div><span class="small" id="drinks"></span></button><button id="play">🧶<div>玩耍</div></button><button id="sleep">🌙<div>睡觉</div></button></div><div class="tabs"><button data-tab="quiz" class="chosen">📚 数学闯关</button><button data-tab="shop">🛍️ 商店</button><button data-tab="home">🏡 小屋</button></div><section class="panel" id="quiz"><b id="chapter"></b><div class="small">答对赚金币与经验，累计五题再奖励20金币！</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="toast" id="message"></div><button id="next" class="primary hidden">下一题 ➜</button><div class="small" style="text-align:center;margin-top:10px" id="count"></div></section><section class="panel hidden" id="shop"><b>🛍️ 喵喵商店</b><div class="grid" id="goods" style="margin-top:12px"></div></section><section class="panel hidden" id="home"><b>🏡 我的小屋</b><p id="homeText"></p><label>小猫名字 <input id="name" maxlength="8" style="width:120px;border:1px solid #edc9d6;border-radius:8px;padding:7px"></label><button id="rename" class="primary">保存名字</button><button id="reset" style="margin-top:16px;background:white;color:#9b8490;font-size:12px">重新开始游戏</button></section><p class="small" style="text-align:center">不需要账号 · 没有广告 · 本机自动保存进度</p></main><script>
(()=>{const $=x=>document.getElementById(x),def=()=>({coins:30,level:1,xp:0,food:75,water:75,happy:80,fish:2,drinks:2,done:0,streak:0,cat:'橘子',house:0,owned:[],equipped:[],q:null,answered:false});let s=def();try{s={...s,...JSON.parse(localStorage.getItem('niannian-cat-pages-v1')||'{}')}}catch(e){}let tab='quiz',msg='';const goods=[['fish','🐟','小鱼干',8,'supply'],['water','💧','清水',5,'supply'],['meal','🍗','营养罐头',20,'meal'],['bow','🎀','蝴蝶结',30,'deco'],['flower','🌷','花园花朵',35,'deco'],['tree','🌳','庭院大树',70,'deco'],['crown','👑','皇冠',90,'deco'],['house1','🏡','温馨小屋',140,'house'],['house2','🏰','猫咪城堡',350,'house']];const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cap=n=>Math.min(100,Math.max(0,n)),need=()=>25+Math.min(50,s.level*3),chapter=()=>Math.min(9,Math.floor((s.level-1)/2)+1),save=()=>{try{localStorage.setItem('niannian-cat-pages-v1',JSON.stringify(s))}catch(e){}},setm=t=>{$('mood').textContent=t};function xp(n){s.xp+=n;while(s.xp>=need()){s.xp-=need();s.level++;s.coins+=15;msg='🎉 升级啦！奖励15金币！'}}function makeQ(){const ch=chapter();let a,b,v,t;if(ch===1){a=r(11,80);b=r(10,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===2){a=r(19,89);b=r(11,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===3){a=r(30,99);b=r(10,a-5);v=a-b;t=a+' − '+b+' = ?'}else if(ch===4){a=r(11,89);b=r(10,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===5){a=r(2,9);b=r(2,9);v=a*b;t=a+' × '+b+' = ?'}else if(ch===6){a=r(2,9);b=r(2,9);v=a;t=(a*b)+' ÷ '+b+' = ?'}else if(ch===7){a=r(10,80);b=r(10,99-a);v=a+b;t='小猫有'+a+'颗星，又得到'+b+'颗，一共有几颗？'}else if(ch===8){a=r(2,9);b=r(2,9);let c=r(2,9);v=a*b+c;t=a+' × '+b+' + '+c+' = ?'}else{a=r(20,90);b=r(10,a);v=a-b;t='有'+a+'条鱼，吃掉'+b+'条，还剩几条？'}let set=new Set([v]),n=0;while(set.size<4&&n++<200){let z=v+r(-15,15);if(z>=0)set.add(z)}s.q={t,v,opts:[...set].sort(()=>Math.random()-.5)};s.answered=false;msg='';save()}function paint(){if(!s.q)makeQ();$('coins').textContent='🪙 '+s.coins;$('level').textContent=s.cat+' · Lv.'+s.level+' · '+(s.level>=10?'大猫':s.level>=5?'少年猫':'小奶猫')+' · 经验 '+s.xp+'/'+need();$('xpbar').style.width=100*s.xp/need()+'%';for(const k of ['food','water','happy']){$(k).textContent=s[k];$(k+'bar').style.width=s[k]+'%'}$('fish').textContent='库存 '+s.fish;$('drinks').textContent='库存 '+s.drinks;$('catlabel').textContent=s.cat+' Lv.'+s.level;$('cat').style.width=Math.min(205,90+(s.level-1)*12)+'px';$('cat').style.height=Math.min(255,115+(s.level-1)*15)+'px';$('scene').className='scene tier'+s.house;$('growthHint').textContent='🐾 '+(s.level>=10?'已经长成大猫啦！':s.level>=5?'长成少年猫啦！':'小奶猫正在成长！')+' · 再答题就能升级';$('decor').innerHTML=s.equipped.map(id=>{const g=goods.find(x=>x[0]===id);return g?'<span class="'+id+'">'+g[1]+'</span>':''}).join('');['quiz','shop','home'].forEach(k=>{$(k).classList.toggle('hidden',k!==tab);document.querySelector('[data-tab="'+k+'"]').classList.toggle('chosen',k===tab)});$('chapter').textContent='第 '+chapter()+' 关 · '+(['两位数加法','进位加法','两位数减法','加法挑战','乘法口诀','除法入门','生活应用题','混合运算','数学高手'][chapter()-1]);$('question').textContent=s.q.t;$('answers').innerHTML='';s.q.opts.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.disabled=s.answered;if(s.answered&&n===s.q.v)b.classList.add('correct');b.onclick=()=>answer(n);$('answers').appendChild(b)});$('next').classList.toggle('hidden',!s.answered);$('message').textContent=msg;$('count').textContent='已答对 '+s.done+' 题';$('goods').innerHTML='';goods.forEach(g=>{if(g[3]===undefined)return;let owned=s.owned.includes(g[0]),locked=g[4]==='house'&&Number(g[0].slice(-1))!==s.house+1,div=document.createElement('div');div.className='item';let icon=document.createElement('div');icon.style.fontSize='34px';icon.textContent=g[1];div.appendChild(icon);let nm=document.createElement('div');nm.textContent=g[2];div.appendChild(nm);let btn=document.createElement('button');btn.textContent=owned?(s.equipped.includes(g[0])?'收起':'摆放'):locked?'🔒 未解锁':'🪙 '+g[3];btn.disabled=locked||(!owned&&s.coins<g[3]);btn.onclick=()=>buy(g);div.appendChild(btn);$('goods').appendChild(div)});$('homeText').textContent='现在是 '+(s.level>=10?'大猫':s.level>=5?'少年猫':'小奶猫')+'，已拥有 '+s.owned.length+' 件装饰。';$('name').value=s.cat;save()}function answer(n){if(s.answered)return;if(n!==s.q.v){msg='🌸 再试一次！你一定可以的';s.streak=0;paint();return}s.answered=true;s.done++;s.streak++;let earned=10+(s.streak%5===0?10:0);s.coins+=earned;msg='✅ 太棒了！获得 '+earned+' 金币和12经验';xp(12);if(s.done%5===0){s.coins+=20;msg+='，另得闯关奖励20金币！'}setm('喵！你真厉害！');paint()}function buy(g){let[id,em,name,price,type]=g;if(type==='deco'&&s.owned.includes(id)){s.equipped=s.equipped.includes(id)?s.equipped.filter(x=>x!==id):[...s.equipped,id];paint();return}if(s.coins<price)return;s.coins-=price;if(type==='supply'){id==='fish'?s.fish++:s.drinks++}else if(type==='meal'){s.food=cap(s.food+45);xp(5)}else if(type==='house'){s.house=Number(id.slice(-1));xp(20)}else{s.owned.push(id);s.equipped.push(id);s.happy=cap(s.happy+10);xp(7)}setm('买到 '+name+' 啦！');paint()}$('feed').onclick=()=>{if(!s.fish){tab='shop';setm('请先买小鱼干');paint();return}s.fish--;s.food=cap(s.food+30);xp(4);setm('好好吃！');paint()};$('drink').onclick=()=>{if(!s.drinks){tab='shop';setm('请先买水');paint();return}s.drinks--;s.water=cap(s.water+30);xp(4);setm('咕噜咕噜！');paint()};$('play').onclick=()=>{s.happy=cap(s.happy+15);s.food=cap(s.food-4);xp(3);setm('好开心！');paint()};$('sleep').onclick=()=>{s.happy=cap(s.happy+8);s.water=cap(s.water-3);xp(2);setm('呼噜呼噜～');paint()};$('next').onclick=()=>{s.food=cap(s.food-2);s.water=cap(s.water-2);makeQ();paint()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint()});$('rename').onclick=()=>{s.cat=$('name').value.trim().slice(0,8)||'橘子';paint()};$('reset').onclick=()=>{if(confirm('确定清除本机游戏进度吗？')){s=def();makeQ();paint()}};paint()})();
</script></body></html>
