<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>念念的喵喵成长屋</title><style>
*{box-sizing:border-box}body{margin:0;background:#ffeff4;color:#594353;font-family:system-ui,-apple-system,sans-serif}.app{max-width:540px;min-height:100vh;margin:auto;padding:15px;background:linear-gradient(#fff4f7,#fff9ee)}h1{font-size:23px;margin:7px 0 14px}.top,.stats,.actions,.tabs,.answers,.grid{display:grid;gap:9px}.top{grid-template-columns:1fr auto;align-items:center}.coins{background:#fff;padding:9px 15px;border-radius:40px;font-weight:900}.stats{grid-template-columns:repeat(3,1fr)}.stats>div,.panel{background:white;border-radius:17px;padding:12px;box-shadow:0 3px 9px #b896a91a}.stats>div{font-size:12px;font-weight:800}.bar{height:9px;border-radius:20px;background:#eee2e7;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ff8ba9;transition:width .25s} .scene{height:350px;position:relative;background:radial-gradient(ellipse at 85% 22%,#fff9d7aa,transparent 36%),linear-gradient(180deg,#dceefa 0%,#e8f1e5 60%,#b6c99b 60%,#93b47d 100%);border:4px solid white;border-radius:24px;margin:12px 0;overflow:hidden;isolation:isolate}
.scene:after{content:"";position:absolute;bottom:0;height:38px;left:0;right:0;background:repeating-linear-gradient(95deg,#8aa86b 0 5px,#97b474 5px 11px);opacity:.7}

.door{height:76%;width:45%;border-radius:55% 55% 0 0;background:radial-gradient(ellipse at 50% 55%,#363034,#6c554c);border:6px solid #8b5f48;box-shadow:inset 0 5px 16px #201e1d}
.scene.tier1 .roof{background:repeating-linear-gradient(0deg,#7f5140 0 5px,#aa7155 5px 11px)}.scene.tier1 .wall{background:repeating-linear-gradient(0deg,#f5d8b4 0 12px,#e9c39c 12px 19px);border-color:#ba8d62}
.scene.tier2{background:linear-gradient(#b4dcfa 0 63%,#a1cfaa 63%)}

.scene{transition:background 1.5s;overflow:hidden}.scene.night{background:linear-gradient(#253652 0 60%,#777c83 60%,#708469 100%)!important}

.cat{width:105px!important;height:135px!important;left:6px;bottom:42px;transition:left 1.15s ease,bottom 1.15s ease,transform .3s ease,width .3s,height .3s;animation:none!important;filter:drop-shadow(0 9px 5px #3e3b3155)}
.cat svg{width:100%;height:100%;overflow:visible}
.cat .head{transform-origin:50% 50%;transition:transform .25s}.cat .eyes-closed,.cat .tongue{opacity:0}
.cat .tail{transform-origin:71% 80%;animation:wag 2.1s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
.cat.action-feed,.cat.action-drink{left:35px;bottom:61px}
.cat.action-feed .head,.cat.action-drink .head{animation:lap .48s ease-in-out infinite}
.cat.action-feed .tongue,.cat.action-drink .tongue{opacity:1;animation:lick .48s infinite alternate}
@keyframes lap{50%{transform:translateY(8px) rotate(5deg)}}

.cat.action-sleep{left:15px;bottom:43px;transform:rotate(75deg) scale(.92)!important}
.cat.action-sleep .eyes-open{opacity:0}.cat.action-sleep .eyes-closed{opacity:1}
.cat.action-sleep .tail{animation:none}
.cat.action-play{left:35px;animation:hop .45s infinite alternate!important}
@keyframes hop{to{translate:9px -22px}}

.scene:has(.action-sleep) .zzz{display:block}
@keyframes zzz{to{transform:translate(21px,-30px);opacity:.1}}
.scene.night .speech{background:#28334de6;color:white}
.scene .decor{z-index:2}.scene .house{z-index:1}
</style></head><body><main class="app"><div class="top"><h1>🐾 念念的喵喵成长屋</h1><div class="coins" id="coins"></div></div><div id="level" style="font-weight:800"></div><div class="bar"><i id="xpbar"></i></div><div class="stats" style="margin-top:12px"><div>🐟 饱腹 <span id="food"></span><div class="bar"><i id="foodbar"></i></div></div><div>💧 水分 <span id="water"></span><div class="bar"><i id="waterbar"></i></div></div><div>💗 开心 <span id="happy"></span><div class="bar"><i id="happybar"></i></div></div></div><div class="scene" id="scene"><div class="speech" id="mood">喵～陪我玩吧！</div><div class="decor" id="decor"></div><div class="house" id="house"><div class="roof"></div><div class="wall"><div class="door"></div></div></div><div class="cat" id="cat" role="img" aria-label="会吃饭喝水睡觉的橘白小猫"><svg viewBox="0 0 130 155" xmlns="http://www.w3.org/2000/svg">

</g></svg></div><div class="pet-action" id="petAction"></div><div class="zzz">Z z z</div><div class="sky-clock" id="skyClock">☀️ 第1天 06:00</div><div class="growth" id="catlabel"></div></div><div class="growth-hint" id="growthHint">答题赚经验，小猫会逐渐长大</div><div class="actions"><button id="feed">🐟<div>喂食</div><span class="small" id="fish"></span></button><button id="drink">🥛<div>喝水</div><span class="small" id="drinks"></span></button><button id="play">🧶<div>玩耍</div></button><button id="sleep">🌙<div>睡觉</div></button></div><div class="tabs"><button data-tab="quiz" class="chosen">📚 数学闯关</button><button data-tab="shop">🛍️ 商店</button><button data-tab="home">🏡 小屋</button></div><section class="panel" id="quiz"><b id="chapter"></b><div class="small">答对赚金币与经验，累计五题再奖励20金币！</div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="toast" id="message"></div><button id="next" class="primary hidden">下一题 ➜</button><div class="small" style="text-align:center;margin-top:10px" id="count"></div></section><section class="panel hidden" id="shop"><b>🛍️ 喵喵商店</b><div class="grid" id="goods" style="margin-top:12px"></div></section><section class="panel hidden" id="home"><b>🏡 我的小屋</b><p id="homeText"></p><label>小猫名字 <input id="name" maxlength="8" style="width:120px;border:1px solid #edc9d6;border-radius:8px;padding:7px"></label><button id="rename" class="primary">保存名字</button><button id="reset" style="margin-top:16px;background:white;color:#9b8490;font-size:12px">重新开始游戏</button></section><p class="small" style="text-align:center">不需要账号 · 没有广告 · 本机自动保存进度</p></main><script>
(()=>{const $=x=>document.getElementById(x),def=()=>({coins:30,level:1,xp:0,food:75,water:75,happy:80,fish:2,drinks:2,done:0,streak:0,cat:'橘子',house:0,owned:[],equipped:[],q:null,answered:false});let s=def();try{s={...s,...JSON.parse(localStorage.getItem('niannian-cat-pages-v1')||'{}')}}catch(e){}let tab='quiz',msg='';const goods=[['fish','🐟','小鱼干',8,'supply'],['water','💧','清水',5,'supply'],['meal','🍗','营养罐头',20,'meal'],['bow','🎀','蝴蝶结',30,'deco'],['flower','🌷','花园花朵',35,'deco'],['tree','🌳','庭院大树',70,'deco'],['crown','👑','皇冠',90,'deco'],['house1','🏡','温馨小屋',140,'house'],['house2','🏰','猫咪城堡',350,'house']];const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,cap=n=>Math.min(100,Math.max(0,n)),need=()=>25+Math.min(50,s.level*3),chapter=()=>Math.min(9,Math.floor((s.level-1)/2)+1),save=()=>{try{localStorage.setItem('niannian-cat-pages-v1',JSON.stringify(s))}catch(e){}},setm=t=>{$('mood').textContent=t};function xp(n){s.xp+=n;while(s.xp>=need()){s.xp-=need();s.level++;s.coins+=15;msg='🎉 升级啦！奖励15金币！'}}function makeQ(){const ch=chapter();let a,b,v,t;if(ch===1){a=r(11,80);b=r(10,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===2){a=r(19,89);b=r(11,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===3){a=r(30,99);b=r(10,a-5);v=a-b;t=a+' − '+b+' = ?'}else if(ch===4){a=r(11,89);b=r(10,99-a);v=a+b;t=a+' + '+b+' = ?'}else if(ch===5){a=r(2,9);b=r(2,9);v=a*b;t=a+' × '+b+' = ?'}else if(ch===6){a=r(2,9);b=r(2,9);v=a;t=(a*b)+' ÷ '+b+' = ?'}else if(ch===7){a=r(10,80);b=r(10,99-a);v=a+b;t='小猫有'+a+'颗星，又得到'+b+'颗，一共有几颗？'}else if(ch===8){a=r(2,9);b=r(2,9);let c=r(2,9);v=a*b+c;t=a+' × '+b+' + '+c+' = ?'}else{a=r(20,90);b=r(10,a);v=a-b;t='有'+a+'条鱼，吃掉'+b+'条，还剩几条？'}let set=new Set([v]),n=0;while(set.size<4&&n++<200){let z=v+r(-15,15);if(z>=0)set.add(z)}s.q={t,v,opts:[...set].sort(()=>Math.random()-.5)};s.answered=false;msg='';save()}function paint(){if(!s.q)makeQ();$('coins').textContent='🪙 '+s.coins;$('level').textContent=s.cat+' · Lv.'+s.level+' · '+(s.level>=10?'大猫':s.level>=5?'少年猫':'小奶猫')+' · 经验 '+s.xp+'/'+need();$('xpbar').style.width=100*s.xp/need()+'%';for(const k of ['food','water','happy']){$(k).textContent=s[k];$(k+'bar').style.width=s[k]+'%'}$('fish').textContent='库存 '+s.fish;$('drinks').textContent='库存 '+s.drinks;$('catlabel').textContent=s.cat+' Lv.'+s.level;$('cat').style.setProperty('width',Math.min(180,92+(s.level-1)*9)+'px','important');$('cat').style.setProperty('height',Math.min(230,120+(s.level-1)*12)+'px','important');$('scene').className='scene tier'+s.house+(simHour()<6||simHour()>=19?' night':'');$('growthHint').textContent='🐾 '+(s.level>=10?'已经长成大猫啦！':s.level>=5?'长成少年猫啦！':'小奶猫正在成长！')+' · 再答题就能升级';$('decor').innerHTML=s.equipped.map(id=>{const g=goods.find(x=>x[0]===id);return g?'<span class="'+id+'">'+g[1]+'</span>':''}).join('');['quiz','shop','home'].forEach(k=>{$(k).classList.toggle('hidden',k!==tab);document.querySelector('[data-tab="'+k+'"]').classList.toggle('chosen',k===tab)});$('chapter').textContent='第 '+chapter()+' 关 · '+(['两位数加法','进位加法','两位数减法','加法挑战','乘法口诀','除法入门','生活应用题','混合运算','数学高手'][chapter()-1]);$('question').textContent=s.q.t;$('answers').innerHTML='';s.q.opts.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.disabled=s.answered;if(s.answered&&n===s.q.v)b.classList.add('correct');b.onclick=()=>answer(n);$('answers').appendChild(b)});$('next').classList.toggle('hidden',!s.answered);$('message').textContent=msg;$('count').textContent='已答对 '+s.done+' 题';$('goods').innerHTML='';goods.forEach(g=>{if(g[3]===undefined)return;let owned=s.owned.includes(g[0]),locked=g[4]==='house'&&Number(g[0].slice(-1))!==s.house+1,div=document.createElement('div');div.className='item';let icon=document.createElement('div');icon.style.fontSize='34px';icon.textContent=g[1];div.appendChild(icon);let nm=document.createElement('div');nm.textContent=g[2];div.appendChild(nm);let btn=document.createElement('button');btn.textContent=owned?(s.equipped.includes(g[0])?'收起':'摆放'):locked?'🔒 未解锁':'🪙 '+g[3];btn.disabled=locked||(!owned&&s.coins<g[3]);btn.onclick=()=>buy(g);div.appendChild(btn);$('goods').appendChild(div)});$('homeText').textContent='现在是 '+(s.level>=10?'大猫':s.level>=5?'少年猫':'小奶猫')+'，已拥有 '+s.owned.length+' 件装饰。';$('name').value=s.cat;save()}function answer(n){if(s.answered)return;if(n!==s.q.v){msg='🌸 再试一次！你一定可以的';s.streak=0;paint();return}s.answered=true;s.done++;s.streak++;let earned=10+(s.streak%5===0?10:0);s.coins+=earned;msg='✅ 太棒了！获得 '+earned+' 金币和12经验';xp(12);if(s.done%5===0){s.coins+=20;msg+='，另得闯关奖励20金币！'}setm('喵！你真厉害！');paint()}function buy(g){let[id,em,name,price,type]=g;if(type==='deco'&&s.owned.includes(id)){s.equipped=s.equipped.includes(id)?s.equipped.filter(x=>x!==id):[...s.equipped,id];paint();return}if(s.coins<price)return;s.coins-=price;if(type==='supply'){id==='fish'?s.fish++:s.drinks++}else if(type==='meal'){s.food=cap(s.food+45);xp(5)}else if(type==='house'){s.house=Number(id.slice(-1));xp(20)}else{s.owned.push(id);s.equipped.push(id);s.happy=cap(s.happy+10);xp(7)}setm('买到 '+name+' 啦！');paint()}
let actionTimer=null,activeAction='',lastTick=Date.now();
if(!s.dayStart)s.dayStart=Date.now();
function simHour(){return Math.floor((Date.now()-s.dayStart)%900000/900000*24)}
function clockTick(){
 const now=Date.now(),elapsed=Math.min(900000,Math.max(0,now-lastTick));lastTick=now;
 // One game day lasts 15 real-world minutes (900000 ms).
 const delta=elapsed/900000;
 if(delta>0){s.food=cap(Math.round((s.food-delta*32)*100)/100);s.water=cap(Math.round((s.water-delta*40)*100)/100);s.happy=cap(Math.round((s.happy-delta*18)*100)/100)}
 const days=Math.floor(Math.max(0,now-s.dayStart)/900000)+1,h=simHour(),mins=Math.floor(((now-s.dayStart)%900000)/900000*1440)%60;
 $('skyClock').textContent=(h<6||h>=19?'🌙':'☀️')+' 第'+days+'天 '+String(h).padStart(2,'0')+':'+String(mins).padStart(2,'0');
 $('scene').classList.toggle('night',h<6||h>=19);
 for(const key of ['food','water','happy']){$(key).textContent=Math.round(s[key]);$(key+'bar').style.width=s[key]+'%'}
 if(s.food<15||s.water<15)setm('喵呜～我需要食物和水');
 save();
}
function doAction(type,duration=3200){
 if(activeAction)return false;
 activeAction=type;$('cat').className='cat action-'+type;
 $('petAction').className='pet-action visible '+type;
 $('petAction').textContent=type==='feed'?'🥣':type==='drink'?'🥛':type==='play'?'🧶':'🛏️';
 for(const id of ['feed','drink','play','sleep'])$(id).disabled=true;
 actionTimer=setTimeout(()=>{$('cat').className='cat';$('petAction').className='pet-action';activeAction='';for(const id of ['feed','drink','play','sleep'])$(id).disabled=false;paint()},duration);
 return true;
}
$('feed').onclick=()=>{if(!s.fish){tab='shop';setm('先去商店买小鱼干');paint();return}if(!doAction('feed'))return;s.fish--;s.food=cap(s.food+30);xp(4);setm('🐟 正在低头吃小鱼干…');paint()};
$('drink').onclick=()=>{if(!s.drinks){tab='shop';setm('先去商店买水');paint();return}if(!doAction('drink'))return;s.drinks--;s.water=cap(s.water+30);xp(4);setm('💧 正在低头喝水…');paint()};
$('play').onclick=()=>{if(!doAction('play',2700))return;s.happy=cap(s.happy+15);s.food=cap(s.food-4);xp(3);setm('🧶 正在追毛线球…');paint()};
$('sleep').onclick=()=>{if(!doAction('sleep',5500))return;s.happy=cap(s.happy+15);s.water=cap(s.water-3);xp(4);setm('🌙 小猫闭眼睡觉中 Zzz…');paint()};
setInterval(clockTick,5000);
clockTick();
$('next').onclick=()=>{s.food=cap(s.food-2);s.water=cap(s.water-2);makeQ();paint()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;paint()});$('rename').onclick=()=>{s.cat=$('name').value.trim().slice(0,8)||'橘子';paint()};$('reset').onclick=()=>{if(confirm('确定清除本机游戏进度吗？')){s=def();makeQ();paint()}};paint()})();
</script></body></html>
